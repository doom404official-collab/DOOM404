name: Wallet Signal v1.0 readiness
on:
  push:
    branches: [feature/wallet-signal-v1-0-readiness, feature/wallet-signal-v1-0-performance]
  workflow_dispatch:
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RPC unit tests
        run: node --test tests/solanaRpc.test.mjs
      - name: Install dependencies
        working-directory: mvp/wallet-signal
        run: npm install --no-audit --no-fund
      - name: Build production application
        working-directory: mvp/wallet-signal
        run: npm run build
      - name: Install browser test dependencies
        working-directory: mvp/wallet-signal
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Start server and run API readiness tests
        working-directory: mvp/wallet-signal
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/wallet-signal-next.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          node tests/input-validation.mjs
          node tests/live-smoke.mjs
          node tests/wallet-diversity.mjs
          node tests/high-volume.mjs
          node tests/visual-acceptance.mjs
          node tests/browser-scenarios.mjs
        env:
          SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
          WALLET_SIGNAL_ACTIVE_TEST_ADDRESS: 1nc1nerator11111111111111111111111111111111
          WALLET_SIGNAL_REQUIRE_ACTIVE: "true"
          WALLET_SIGNAL_HIGH_VOLUME_TEST_ADDRESS: 1nc1nerator11111111111111111111111111111111
          WALLET_SIGNAL_MIN_SIGNATURES: "1000"
      - name: Upload visual test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-signal-visual-acceptance
          path: mvp/wallet-signal/test-artifacts/*.png
          if-no-files-found: ignore
