name: GLITCH evidence validation worker
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read
concurrency:
  group: glitch-evidence-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/feature/glitch-assessment-sprint1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Process one bounded evidence batch
        env:
          GLITCH_PREVIEW_URL: ${{ vars.GLITCH_PREVIEW_URL }}
          GLITCH_HOLDER_WORKER_TOKEN: ${{ secrets.GLITCH_HOLDER_WORKER_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse
          base=os.environ.get("GLITCH_PREVIEW_URL","").rstrip("/")
          token=os.environ.get("GLITCH_HOLDER_WORKER_TOKEN","")
          bypass=os.environ.get("VERCEL_AUTOMATION_BYPASS_SECRET","")
          if not base.startswith("https://") or not token or not bypass:
              raise SystemExit("Worker configuration missing")
          host=urllib.parse.urlparse(base).hostname
          if not host or not host.endswith(".vercel.app"):
              raise SystemExit("Preview hostname rejected")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):
                  raise RuntimeError("Authenticated redirect refused")
          opener=urllib.request.build_opener(NoRedirect)
          req=urllib.request.Request(base+"/api/holder-evidence-tick",method="POST",data=b"{}",
              headers={"Content-Type":"application/json","x-glitch-worker-token":token,
                       "x-vercel-protection-bypass":bypass})
          with opener.open(req,timeout=75) as response:
              result=json.load(response)
          def reject_response(reason):
              print("::error title=GLITCH Evidence Response::"+reason)
              raise SystemExit("Evidence response requires attention")
          def nonnegative_int(value):
              return type(value) is int and value >= 0
          if not isinstance(result,dict):
              reject_response("invalid_response")
          status=result.get("status")
          if status not in ("processed","idle","no_claims"):
              reject_response("unexpected_status")
          processed=result.get("processed")
          request_count=result.get("requestCount")
          if not nonnegative_int(processed) or not nonnegative_int(request_count) or processed>request_count or request_count>6:
              reject_response("invalid_progress_counts")
          claimed=result.get("claimed")
          lease_lost=result.get("leaseLost")
          if not nonnegative_int(claimed) or not nonnegative_int(lease_lost) or claimed!=request_count or processed+lease_lost!=claimed:
              reject_response("invalid_claim_counts")
          if lease_lost:
              reject_response("lease_lost")
          if status in ("idle","no_claims"):
              if processed!=0 or request_count!=0:
                  reject_response("invalid_idle_response")
          elif processed==0:
              reject_response("no_progress")
          if status!="idle" and not nonnegative_int(result.get("queuedSignatures")):
              reject_response("missing_queue_count")
          health=result.get("health")
          health_fields=("total","pending","verified","rejected","unavailable","active_leases","expired_leases","retry_exhausted")
          if not isinstance(health,dict) or any(not nonnegative_int(health.get(key)) for key in health_fields):
              reject_response("invalid_or_missing_health")
          print(json.dumps({"status":status,"processed":processed,"queuedSignatures":result.get("queuedSignatures"),"requestCount":request_count,"claimed":claimed,"leaseLost":lease_lost,"health":{key:health[key] for key in health_fields}}))
          issues=[key for key in ("retry_exhausted","expired_leases") if health[key]>0]
          if issues:
              print("::error title=GLITCH Evidence Health::"+",".join(issues)+" require attention")
              raise SystemExit("Evidence health requires attention")
          PY
