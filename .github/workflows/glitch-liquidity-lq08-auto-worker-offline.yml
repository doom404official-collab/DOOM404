name: GLITCH LQ08 automatic worker offline gate
on:
  pull_request:
    paths:
      - 'mvp/wallet-signal/lib/liquidity*.mjs'
      - 'mvp/wallet-signal/scripts/liquidity-validate-successor.mjs'
      - 'mvp/wallet-signal/lib/liquidityAutoWorkerDecision.mjs'
      - 'mvp/wallet-signal/tests/liquidity-auto-worker-decision.test.mjs'
      - 'mvp/wallet-signal/lib/liquidityAutoWorkerOrchestrator.mjs'
      - 'mvp/wallet-signal/tests/liquidity-auto-worker-orchestrator.test.mjs'
      - 'mvp/wallet-signal/lib/liquidityAutoWorkerEvidenceGate.mjs'
      - 'mvp/wallet-signal/tests/liquidity-auto-worker-evidence.test.mjs'
      - 'mvp/wallet-signal/lib/liquidityAutoWorkerSimulation.mjs'
      - 'mvp/wallet-signal/tests/liquidity-auto-worker-simulation.test.mjs'
      - 'mvp/wallet-signal/lib/liquidityAutoWorkerBudget.mjs'
      - 'mvp/wallet-signal/tests/liquidity-auto-worker-budget.test.mjs'
      - '.github/workflows/glitch-liquidity-lq08-auto-worker-offline.yml'
permissions:
  contents: read
concurrency:
  group: glitch-liquidity-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test mvp/wallet-signal/tests/liquidity-auto-worker-decision.test.mjs mvp/wallet-signal/tests/liquidity-auto-worker-orchestrator.test.mjs mvp/wallet-signal/tests/liquidity-auto-worker-evidence.test.mjs mvp/wallet-signal/tests/liquidity-auto-worker-simulation.test.mjs mvp/wallet-signal/tests/liquidity-auto-worker-budget.test.mjs
