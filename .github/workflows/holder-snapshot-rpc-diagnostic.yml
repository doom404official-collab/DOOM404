name: Holder Snapshot RPC Diagnostic
on:
  workflow_dispatch:
    inputs:
      mint:
        description: 'Solana mint address to inspect'
        required: true
        type: string
      mode:
        description: 'diagnostic or bounded replacement canonical capture'
        type: choice
        options: [diagnostic, canonical]
        default: diagnostic
      reviewed_sha:
        description: 'Exact reviewed integration SHA; required for canonical capture'
        type: string
        required: false
permissions:
  contents: read
jobs:
  inspect:
    concurrency:
      group: glitch-canonical-holder-capture
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - name: Validate canonical capture authorization
        if: inputs.mode == 'canonical'
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          SELECTED_MINT: ${{ inputs.mint }}
        run: |
          python3 - <<'PY'
          import os,re
          assert os.environ['GITHUB_REPOSITORY']=='doom404official-collab/DOOM404'
          assert os.environ['GITHUB_REF']=='refs/heads/integration/glitch-app-main-20261118'
          assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert re.fullmatch('[0-9a-f]{40}',os.environ['REVIEWED_SHA'])
          assert os.environ['REVIEWED_SHA']==os.environ['GITHUB_SHA']
          assert os.environ['SELECTED_MINT']=='98kfF7rmsg1QDUEoCqNE7g7M1FdrTt92TEp2CLzypump'
          PY
        working-directory: .
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check holder snapshot
        if: inputs.mode != 'canonical'
        env:
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          TEST_TOKEN_MINT: ${{ inputs.mint }}
        run: node scripts/check-holder-snapshot.mjs
      - name: Capture bounded canonical candidate without history restart
        if: inputs.mode == 'canonical'
        env:
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
        run: node scripts/capture-canonical-holder-snapshot.mjs
      - name: Retain complete public-chain account mapping for validation and persistence
        if: success() && inputs.mode == 'canonical'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-holder-snapshot-${{ github.run_id }}
          path: |
            mvp/wallet-signal/canonical-holder-snapshot.json
            mvp/wallet-signal/canonical-holder-snapshot-recovery.json
            mvp/wallet-signal/canonical-holder-classifications.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Preserve captured public-chain inventory if classification stops
        if: failure() && inputs.mode == 'canonical'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-holder-recovery-${{ github.run_id }}
          path: mvp/wallet-signal/canonical-holder-snapshot-recovery.json
          if-no-files-found: ignore
          retention-days: 90
          overwrite: false
