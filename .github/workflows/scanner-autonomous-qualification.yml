name: Scanner isolated autonomous core qualification
on:
  push:
    branches: [qualification/autonomous-engine-20261128]
    paths: ['mvp/wallet-signal/**', '.github/workflows/scanner-autonomous-qualification.yml']
permissions:
  contents: read
concurrency:
  group: scanner-autonomous-live
  cancel-in-progress: false
jobs:
  qualification:
    if: github.repository == 'doom404official-collab/DOOM404'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:smoke
      - name: Blind mint-only investigation core cold and warm capture
        env:
          ALCHEMY_RPC_URL: ${{ secrets.ALCHEMY_RPC_URL }}
          ALCHEMY_SOLANA_ARCHIVE_RPC_URL: ${{ secrets.ALCHEMY_SOLANA_ARCHIVE_RPC_URL }}
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QUALIFICATION_MINTS: '["GfCYBjm53ccUbyyDUqWTQc2idTsjM1EQCPPYUiR3pump","436BcX8hF6ERozLniyL8d75bVJbRvxJJtdroKWC2pump","25AjGcSqMxJ9EFN3NN2P7j4rv7odDdnhjSHzaemgpump","6yiZmaeQSW3FUHYjqtzZFNSM6Xy4zJ89XeQRcg6mpump","GS514xunWdMXSMJmV1t3buC7AfWBgupe6EgiB3zNpump","FvNopjpk7upJ4GghufMrJJ7W8aaH2tdoEozDZtUbiYKD","FDubarsoPNtdArUFcoMEhhfcZT2Ahepzs3ggwgnGpump","D93retv2ARUMciip7EA4rUWtu653QhjQKCkni1FPpump","BFJbGUL1rWf22nF9CHAJuGzpQaxQeD79qT25TXXEpump","GiUpEeH93E5J5gQvgjB8v6rKx1guaPR7ZU2eaSppTx9Q","CizWKoDGhVXbFowZr3pMLxY5rnPr7yXtLNN2dQ2AbEDZ","Aovr4TdVH6qtZHcv4og6CLqn7gjNYtmDRQULYZSTz1Qf","BKGp1At3yLDK1NE2gfMuwv1QMAHBwnqgSdULsyzjUagA","4iPKfHxmYX29fr5nnXdNifA52GJKokWeRmQ67hApGySJ","AkAF22MXs5xcwH1BineDvrD81sFV1dCuXX5PQzYdko46","3gr25JueJADKQrmqeS6cRQukvbiNffHdMofj6xf7XBV5","H5iiBHeCGKkzucX5PwEn2cf2uWHyVnAg3aq5RRsWF5P8","9qRarZBguWMeD2QMZVxEyVYDWRFKJqbPbyDuJNCriojb","DYu4rwdqSRmeastBxQVrsRYzM6bZMGUMSB6cDfWNarw9","3npZ7QNBiRLYNrGqEy4Uefm5GXdruPBoxS7FktV2bkE3"]'
