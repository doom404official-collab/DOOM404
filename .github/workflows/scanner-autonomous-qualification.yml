name: Scanner isolated autonomous core qualification
on:
  push:
    branches: [qualification/autonomous-engine-20261128]
    paths: ['mvp/wallet-signal/lib/**', 'mvp/wallet-signal/scripts/qualification/live-core.mjs', '.github/workflows/scanner-autonomous-qualification.yml']
permissions:
  contents: read
concurrency:
  group: scanner-autonomous-live
  cancel-in-progress: false
jobs:
  qualification:
    if: github.repository == 'doom404official-collab/DOOM404' && !contains(github.event.head_commit.message, '[reference-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:smoke
      - name: Known-fixture mint-only core cold and warm capture
        env:
          ALCHEMY_RPC_URL: ${{ secrets.ALCHEMY_RPC_URL }}
          ALCHEMY_SOLANA_ARCHIVE_RPC_URL: ${{ secrets.ALCHEMY_SOLANA_ARCHIVE_RPC_URL }}
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QUALIFICATION_MINTS: '["98kfF7rmsg1QDUEoCqNE7g7M1FdrTt92TEp2CLzypump","EMQGeopasoZZUqiPDErvSL1QqvGr5WfZ1hbcvmAf8C3Y","4kjruqGHDsSqkMdFfCjV7Vb62HPFhtXyWc2t6JpQzDnz","9cRCn9rGT8V2imeM2BaKs13yhMEais3ruM3rPvTGpump","DEW9dSN6QpWyNthphCpMmAbZP1Q4cEKR9xQXAri98WDP","Bv1a7cEj5aRnJQhMw4kRQqAFesMSd5LwcDnUzq52BMmr","6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN","3Tg6YnNrfPdFfsY14MaNsDMWLseAyrUDS3myJtbaJN6f","9hjBLBrc7WZW2H8UQvBAvG5WiTZotXUv2Bdcn4f4pump","Ai66LHZG9MCzg1WKdawwqduVAXpNDUuV8M3uyq5ppump"]'
