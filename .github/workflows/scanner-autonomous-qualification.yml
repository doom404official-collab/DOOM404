          REFERENCE_EXPECTED_MINTS: '["CQpb2WSz3GiS3geRyxukRrE1DyxxV8XBFwCaWuNwpump","9mzd8ozjxXu9ApNoQaSbAXWcRJB7rGpaD9LLMdo5Pn2c","AQdRK8YPLdiKmXQVNbSTQfZrPSkmdXSh7uZWAVnEpump","GMat1LbX2USa4vWSXBMSLPyD5JrY6KJuj4rybLQEpump","GPqw7AfgGhJ7X3ETz4P6mWDKG7eed4pjeQYVb5Nshidd","CqWSJtkMMY16q9QLnQxktM1byzVHGRr8b6LCPuZnEeiL","EKhDvdnC3SPqTuKR5fpkyb4qMNpXJokXvG4SgzaucwNy","79BXbiiN5HcXH1vRHbQgs9T9Qmae9por26ULEMXuaP7L","A1LwvSDH2v6swHXP9JMxYJVx6YDzdQdnBDvy8VeBA3g1","6dmkrp3XjSGyd2kWQCnKtvaufBR4ov7ZDAsrWbGbYTbX"]'
