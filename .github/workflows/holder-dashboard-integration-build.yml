name: Holder Dashboard Integration Build
on:
  workflow_dispatch:
  push:
    branches:
      - feature/glitch-holder-dashboard-integration
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check lib/consolidateTop20.mjs
      - run: node --check lib/top20NetworkScore.mjs
      - run: node --check lib/top20Vault.mjs
      - run: node --test lib/assessmentAvailability.test.mjs lib/publicDeepScanAdmission.test.mjs
      - run: npm run build
