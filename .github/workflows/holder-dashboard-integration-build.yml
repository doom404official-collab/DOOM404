name: Holder Dashboard Integration Build
on:
  workflow_dispatch:
  push:
    branches:
      - feature/glitch-holder-dashboard-integration
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check lib/consolidateTop20.mjs
      - run: node --check lib/top20NetworkScore.mjs
      - run: node --check lib/top20Vault.mjs
      - run: node --test lib/assessmentAvailability.test.mjs lib/publicDeepScanAdmission.test.mjs lib/deepScanQuota.test.mjs lib/verifyScanUser.test.mjs lib/scanStartLock.test.mjs lib/customerScanAdmission.test.mjs lib/rpcQuotaDomains.test.mjs lib/sharedRpcLimiter.test.mjs lib/customerRpcAdmission.test.mjs lib/rpcContentionHarness.test.mjs
      - run: node --test tests/holder-adaptive-decoding.test.mjs tests/holder-pagination-fairness.test.mjs tests/holder-pending-retry.test.mjs tests/holder-scan-start-safety.test.mjs tests/public-deep-scan-route.test.mjs
      - run: npm run build
