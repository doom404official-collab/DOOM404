name: GLITCH evidence validation manual
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: read
concurrency:
  group: glitch-evidence-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run bounded preview evidence validation
        env:
          GLITCH_PREVIEW_URL: ${{ vars.GLITCH_PREVIEW_URL }}
          GLITCH_HOLDER_WORKER_TOKEN: ${{ secrets.GLITCH_HOLDER_WORKER_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request,urllib.error
          url=os.environ.get("GLITCH_PREVIEW_URL","").rstrip("/")
          token=os.environ.get("GLITCH_HOLDER_WORKER_TOKEN","")
          bypass=os.environ.get("VERCEL_AUTOMATION_BYPASS_SECRET","")
          host=urllib.parse.urlparse(url).hostname
          if not host or not host.endswith(".vercel.app") or not url.startswith("https://"):
              raise SystemExit("Invalid preview URL")
          if not token or not bypass:
              raise SystemExit("Missing worker credentials")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):
                  raise RuntimeError("Redirect refused")
          opener=urllib.request.build_opener(NoRedirect)
          req=urllib.request.Request(url+"/api/holder-evidence-tick",data=b"{}",method="POST",
              headers={"Content-Type":"application/json","x-glitch-worker-token":token,
                       "x-vercel-protection-bypass":bypass})
          try:
              with opener.open(req,timeout=75) as response:
                  result=json.load(response)
          except urllib.error.HTTPError as exc:
              try:
                  body=json.loads(exc.read().decode("utf-8"))
                  print(json.dumps({"httpStatus":exc.code,"stage":body.get("stage","unknown"),"code":body.get("code","unknown")}))
              except (ValueError,UnicodeError):
                  print(json.dumps({"httpStatus":exc.code,"stage":"unknown","code":"NON_JSON_RESPONSE"}))
              raise SystemExit("Evidence endpoint failed")
          health=result.get("health") or {}
          print(json.dumps({"status":result.get("status"),"processed":result.get("processed"),"queuedSignatures":result.get("queuedSignatures"),"requestCount":result.get("requestCount"),"health":health}))
          issues=[k for k in ("retry_exhausted","expired_leases") if int(health.get(k,0) or 0)>0]
          if issues:
              print("::error title=GLITCH Evidence Health::"+",".join(issues)+" require attention")
              raise SystemExit("Evidence health requires attention")
          PY
