# Reuses an already registered manual workflow path. No historical workers run here.
name: Scanner reviewed release authorization
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed 40-character Scanner commit SHA
        type: string
        required: true
      candidate_deployment_id:
        description: Exact protected Vercel deployment ID
        type: string
        required: true
      candidate_url:
        description: Exact protected Scanner preview URL ending with /
        type: string
        required: true
      authorize_production:
        description: Request owner approval of the exact candidate; does not promote
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  checks: read
  statuses: write
concurrency:
  group: scanner-production-release-authorization
  cancel-in-progress: false
jobs:
  reviewed-release:
    name: scanner-reviewed-sha
    if: github.repository == 'doom404official-collab/DOOM404' && github.ref == 'refs/heads/integration/glitch-app-main-20261118'
    environment:
      name: ${{ inputs.authorize_production && 'Production – doom404-wallet-signal' || 'Preview – doom404-wallet-signal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Mark release authorization pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCANNER_CHECK_NAME: scanner-reviewed-sha
          SCANNER_CHECK_STATE: pending
        run: node scripts/security/publish-release-status.mjs
      - name: Verify exact SHA, protected candidate and successful security checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          CANDIDATE_DEPLOYMENT_ID: ${{ inputs.candidate_deployment_id }}
          CANDIDATE_URL: ${{ inputs.candidate_url }}
          AUTHORIZE_PRODUCTION: ${{ inputs.authorize_production }}
          RELEASE_ENVIRONMENT: ${{ inputs.authorize_production && 'Production – doom404-wallet-signal' || 'Preview – doom404-wallet-signal' }}
        run: node scripts/security/verify-reviewed-release.mjs
      - name: Publish native Vercel reviewed-SHA result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCANNER_CHECK_NAME: scanner-reviewed-sha
          SCANNER_CHECK_STATE: ${{ job.status == 'success' && inputs.authorize_production && 'success' || 'failure' }}
        run: node scripts/security/publish-release-status.mjs
