name: GLITCH Public Deep Scan POST Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/glitch-holder-dashboard-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-public-deep-scan-post.mjs
        env:
          GLITCH_PREVIEW_URL: https://doom404-wallet-signal-git-feature-glitch-holder-9f3530-doom-404.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
