# GLITCH Holder Worker — controlled scheduler
# Manual fallback. Serialized with the automatic workflow.
name: GLITCH holder worker manual
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit manual mode; disabled performs no work
        type: choice
        options: [disabled, assessment, recovery]
        default: disabled
      expected_sha:
        description: Independently reviewed full dispatch commit SHA (recovery only)
        type: string
      starts_at:
        description: Approved UTC start in YYYY-MM-DDTHH:mm:ss.sssZ format
        type: string
      expires_at:
        description: Approved UTC expiry, no more than 20 minutes after start
        type: string
      c670_version:
        description: Fresh sealed version for existing c670 investigation
        type: string
      d07_version:
        description: Fresh sealed version for existing d07 investigation
        type: string
permissions:
  contents: read
concurrency:
  group: glitch-holder-investigation
  cancel-in-progress: false
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'assessment' && github.ref == 'refs/heads/feature/glitch-assessment-sprint1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check scheduler and process one candidate
        env:
          GLITCH_PREVIEW_URL: https://doom404-wallet-signal-git-feature-glitch-assess-3d8131-doom-404.vercel.app
          GLITCH_HOLDER_WORKER_TOKEN: ${{ secrets.GLITCH_HOLDER_WORKER_TOKEN }}
          GLITCH_HOLDER_SCAN_INTERNAL_TOKEN: ${{ secrets.GLITCH_HOLDER_SCAN_INTERNAL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,urllib.parse
          base=os.environ.get("GLITCH_PREVIEW_URL","").rstrip("/")
          token=os.environ.get("GLITCH_HOLDER_WORKER_TOKEN","")
          bypass=os.environ.get("VERCEL_AUTOMATION_BYPASS_SECRET","")
          if not bypass:raise SystemExit("Vercel automation bypass secret missing")
          if not base.startswith("https://") or not token:
              raise SystemExit("Preview URL or worker token not configured")
          if urllib.parse.urlparse(base).hostname != "doom404-wallet-signal-git-feature-glitch-assess-3d8131-doom-404.vercel.app":
              raise SystemExit("Only explicit Vercel preview hosts are allowed")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,hdrs,newurl):
                  raise RuntimeError("Redirect refused for authenticated worker request")
          opener=urllib.request.build_opener(NoRedirect)
          def post(path,payload):
              req=urllib.request.Request(base+path,data=json.dumps(payload).encode(),
                  headers={"Content-Type":"application/json","x-glitch-worker-token":token,"x-vercel-protection-bypass":bypass},method="POST")
              try:
                  with opener.open(req,timeout=70) as response:return json.load(response)
              except urllib.error.HTTPError as exc:raise RuntimeError(f"Worker endpoint HTTP {exc.code}") from None
          mint="98kfF7rmsg1QDUEoCqNE7g7M1FdrTt92TEp2CLzypump"
          start_token=os.environ.get("GLITCH_HOLDER_SCAN_INTERNAL_TOKEN","")
          if not start_token:raise SystemExit("Scan-start secret missing")
          def start_scan():
              req=urllib.request.Request(base+"/api/holder-scan-start",
                  data=json.dumps({"mint":mint}).encode(),method="POST",
                  headers={"Content-Type":"application/json","x-glitch-internal-token":start_token,"x-vercel-protection-bypass":bypass})
              try:
                  with opener.open(req,timeout=70) as response:return json.load(response)
              except urllib.error.HTTPError as exc:raise RuntimeError(f"Scan-start HTTP {exc.code}") from None
          started=start_scan()
          print(json.dumps({"step":"start","status":started.get("status")}))
          for batch in range(2):
              result=post("/api/holder-scan-tick",{})
              print(json.dumps({"step":"tick","batch":batch+1,"status":result.get("status"),"requestCount":result.get("requestCount")}))
              if result.get("status")=="idle":break
          status_request=urllib.request.Request(base+"/api/holder-scan-status?mint="+mint,
              headers={"x-vercel-protection-bypass":bypass})
          with opener.open(status_request,timeout=30) as response:
              state=json.load(response)
          scan=state.get("scan") or {}
          print(json.dumps({"step":"verify","status":state.get("status"),
              "transactionsChecked":scan.get("transactionsChecked"),
              "walletHistoriesReached":scan.get("walletHistoriesReached"),
              "directPairs":scan.get("directPairs")}))
          if state.get("status")=="not_started":raise SystemExit("Checkpoint not persisted")
          PY

  recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'recovery' && github.repository == 'doom404official-collab/DOOM404' && github.ref == 'refs/heads/fix/glitch-recovery-preflight-20261027' && github.run_attempt == 1 && github.sha == inputs.expected_sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute sealed Holder recovery once
        working-directory: mvp/wallet-signal
        env:
          HOLDER_MANUAL_MODE: ${{ inputs.mode }}
          HOLDER_EXPECTED_SHA: ${{ inputs.expected_sha }}
          GLITCH_HOLDER_RECOVERY_START_AT: ${{ inputs.starts_at }}
          GLITCH_HOLDER_RECOVERY_EXPIRES_AT: ${{ inputs.expires_at }}
          GLITCH_HOLDER_RECOVERY_JOB_C670_VERSION: ${{ inputs.c670_version }}
          GLITCH_HOLDER_RECOVERY_JOB_D07_VERSION: ${{ inputs.d07_version }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
        run: node scripts/run-holder-actions-recovery.mjs
      - name: Retain redacted recovery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holder-recovery-receipt-${{ github.run_id }}
          path: mvp/wallet-signal/artifacts/holder-recovery-receipt.json
          if-no-files-found: warn
          retention-days: 3
