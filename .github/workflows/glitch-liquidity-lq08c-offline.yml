name: GLITCH LQ08C offline execution contract
on:
  pull_request:
    paths:
      - 'mvp/wallet-signal/lib/liquidity*.mjs'
      - 'mvp/wallet-signal/scripts/liquidity-validate-successor.mjs'
      - 'mvp/wallet-signal/lib/liquidityAutoExecutionContract.mjs'
      - 'mvp/wallet-signal/tests/liquidity-auto-execution-contract.test.mjs'
      - '.github/workflows/glitch-liquidity-lq08c-offline.yml'
permissions:
  contents: read
concurrency:
  group: glitch-liquidity-history-worker
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test mvp/wallet-signal/tests/liquidity-auto-execution-contract.test.mjs
