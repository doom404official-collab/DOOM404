name: Helius Historical Throughput Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: helius-live-diagnostic
  cancel-in-progress: false
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historical RPC sample
        run: node scripts/check-helius-history-throughput.mjs
        env:
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
