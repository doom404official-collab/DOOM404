name: GLITCH liquidity checkpoint discovery shadow
on:
  workflow_dispatch:
    inputs:
      pool:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: glitch-liquidity-checkpoint-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.ref == 'refs/heads/feature/glitch-liquidity-evidence-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover checkpoint artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p checkpoint-artifacts
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired==false and (.name|test("^liquidity-(reconciled|history)-[0-9]+$"))) | [.workflow_run.id,.name] | @tsv' > artifact-candidates.tsv
          test -s artifact-candidates.tsv
          count=$(wc -l < artifact-candidates.tsv)
          if [ "$count" -gt 12 ]; then echo "Too many candidate artifacts; pagination/lineage review required"; exit 1; fi
          : > discovery-records.jsonl
          # Never silently truncate the candidate set: lineage must be complete.
          while IFS=$'\t' read -r run name; do
            case "$run" in *[!0-9]*|'') exit 1;; esac
            prefix="${name%-"$run"}"
            [ "$name" = "$prefix-$run" ] || exit 1
            branch=$(gh api "repos/${{ github.repository }}/actions/runs/$run" --jq '.head_branch')
            conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/$run" --jq '.conclusion')
            [ "$branch" = "feature/glitch-liquidity-evidence-worker" ] || continue
            [ "$conclusion" = "success" ] || continue
            mkdir -p "checkpoint-artifacts/$run"
            gh run download "$run" --name "$name" --dir "checkpoint-artifacts/$run"
            file="$GITHUB_WORKSPACE/checkpoint-artifacts/$run/liquidity-history-evidence.json"
            test -s "$file"
            jq -nc --argjson runId "$run" --arg branch "$branch" --arg conclusion "$conclusion" --arg prefix "$prefix" --arg artifactName "$name" --arg path "$file" '{runId:$runId,branch:$branch,conclusion:$conclusion,prefix:$prefix,artifactName:$artifactName,path:$path}' >> discovery-records.jsonl
          done < artifact-candidates.tsv
          jq -s '.' discovery-records.jsonl > discovery-records.json
          test "$(jq length discovery-records.json)" -gt 0
      - name: Validate and select checkpoint
        working-directory: mvp/wallet-signal
        env:
          GLITCH_LIQUIDITY_POOL: ${{ inputs.pool }}
        run: |
          node scripts/liquidity-validate-artifact-discovery.mjs ../../discovery-records.json ../../checkpoint-manifest.json
          node scripts/liquidity-select-checkpoint.mjs ../../checkpoint-manifest.json ../../selected-checkpoint.json
      - name: Preserve selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-discovery-${{ github.run_id }}
          path: |
            discovery-records.json
            checkpoint-manifest.json
            selected-checkpoint.json
          retention-days: 30
          if-no-files-found: ignore
