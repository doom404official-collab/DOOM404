name: Holder Network Live Diagnostic
on:
  workflow_dispatch:
    inputs:
      mint:
        description: 'Solana mint address'
        required: true
        type: string
      start_index:
        description: 'Top-20 offset (0, 5, 10, or 15)'
        required: true
        default: '0'
        type: string
      batch_size:
        description: 'Number of holders (1-5 recommended)'
        required: true
        default: '5'
        type: string
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Investigate sampled holder network
        env:
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          TEST_TOKEN_MINT: ${{ inputs.mint }}
          HOLDER_START_INDEX: ${{ inputs.start_index }}
          HOLDER_BATCH_SIZE: ${{ inputs.batch_size }}
        run: node scripts/check-holder-network.mjs
