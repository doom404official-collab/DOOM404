name: Holder Concentration Scoring Tests
on:
  push:
    branches:
      - feature/holder-concentration-scoring
    paths:
      - 'mvp/wallet-signal/lib/holderConcentrationScore.mjs'
      - 'mvp/wallet-signal/lib/holderConcentrationScore.test.mjs'
      - 'mvp/wallet-signal/lib/concentrationEvidence.mjs'
      - 'mvp/wallet-signal/lib/concentrationEvidence.test.mjs'
      - 'mvp/wallet-signal/lib/holderConcentrationAdapter.mjs'
      - 'mvp/wallet-signal/lib/holderConcentrationAdapter.test.mjs'
      - 'mvp/wallet-signal/lib/concentrationEvidenceBridge.mjs'
      - 'mvp/wallet-signal/lib/concentrationEvidenceBridge.test.mjs'
      - 'mvp/wallet-signal/lib/holderProviderIntegration.mjs'
      - 'mvp/wallet-signal/lib/holderProviderIntegration.test.mjs'
      - 'mvp/wallet-signal/lib/holderRelationshipNetwork.mjs'
      - 'mvp/wallet-signal/lib/holderRelationshipNetwork.test.mjs'
      - 'mvp/wallet-signal/lib/historicalSolRelationships.mjs'
      - 'mvp/wallet-signal/lib/historicalSolRelationships.test.mjs'
      - 'mvp/wallet-signal/lib/crossAssetTokenTransfers.mjs'
      - 'mvp/wallet-signal/lib/crossAssetTokenTransfers.test.mjs'
      - 'mvp/wallet-signal/lib/holderNetworkExposure.mjs'
      - 'mvp/wallet-signal/lib/holderNetworkExposure.test.mjs'
      - 'mvp/wallet-signal/lib/signaturePagination.mjs'
      - 'mvp/wallet-signal/lib/signaturePagination.test.mjs'
      - 'mvp/wallet-signal/lib/historicalRpcRetry.test.mjs'
      - 'mvp/wallet-signal/lib/holderSampleInvestigation.mjs'
      - 'mvp/wallet-signal/lib/holderSampleInvestigation.test.mjs'
      - '.github/workflows/holder-concentration-tests.yml'
  pull_request:
    paths:
      - 'mvp/wallet-signal/lib/holderConcentrationScore.mjs'
      - 'mvp/wallet-signal/lib/holderConcentrationScore.test.mjs'
      - 'mvp/wallet-signal/lib/concentrationEvidence.mjs'
      - 'mvp/wallet-signal/lib/concentrationEvidence.test.mjs'
      - 'mvp/wallet-signal/lib/holderConcentrationAdapter.mjs'
      - 'mvp/wallet-signal/lib/holderConcentrationAdapter.test.mjs'
      - 'mvp/wallet-signal/lib/concentrationEvidenceBridge.mjs'
      - 'mvp/wallet-signal/lib/concentrationEvidenceBridge.test.mjs'
      - 'mvp/wallet-signal/lib/holderProviderIntegration.mjs'
      - 'mvp/wallet-signal/lib/holderProviderIntegration.test.mjs'
      - 'mvp/wallet-signal/lib/holderRelationshipNetwork.mjs'
      - 'mvp/wallet-signal/lib/holderRelationshipNetwork.test.mjs'
      - 'mvp/wallet-signal/lib/historicalSolRelationships.mjs'
      - 'mvp/wallet-signal/lib/historicalSolRelationships.test.mjs'
      - 'mvp/wallet-signal/lib/crossAssetTokenTransfers.mjs'
      - 'mvp/wallet-signal/lib/crossAssetTokenTransfers.test.mjs'
      - 'mvp/wallet-signal/lib/holderNetworkExposure.mjs'
      - 'mvp/wallet-signal/lib/holderNetworkExposure.test.mjs'
      - 'mvp/wallet-signal/lib/signaturePagination.mjs'
      - 'mvp/wallet-signal/lib/signaturePagination.test.mjs'
      - 'mvp/wallet-signal/lib/historicalRpcRetry.test.mjs'
      - 'mvp/wallet-signal/lib/holderSampleInvestigation.mjs'
      - 'mvp/wallet-signal/lib/holderSampleInvestigation.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --prefix mvp/wallet-signal
      - run: node --test mvp/wallet-signal/lib/holderConcentrationScore.test.mjs mvp/wallet-signal/lib/concentrationEvidence.test.mjs mvp/wallet-signal/lib/holderConcentrationAdapter.test.mjs mvp/wallet-signal/lib/concentrationEvidenceBridge.test.mjs mvp/wallet-signal/lib/holderProviderIntegration.test.mjs mvp/wallet-signal/lib/holderRelationshipNetwork.test.mjs mvp/wallet-signal/lib/historicalSolRelationships.test.mjs mvp/wallet-signal/lib/crossAssetTokenTransfers.test.mjs mvp/wallet-signal/lib/holderNetworkExposure.test.mjs mvp/wallet-signal/lib/signaturePagination.test.mjs mvp/wallet-signal/lib/historicalRpcRetry.test.mjs mvp/wallet-signal/lib/holderSampleInvestigation.test.mjs
