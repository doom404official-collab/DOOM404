name: GLITCH liquidity evidence worker (stage 1)
on:
  workflow_dispatch:
    inputs:
      mint:
        description: Solana token mint to investigate
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: glitch-liquidity-evidence-${{ inputs.mint }}
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/feature/glitch-liquidity-evidence-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: mvp/wallet-signal
      - name: Collect conservative pool account evidence
        working-directory: mvp/wallet-signal
        env:
          GLITCH_PREVIEW_URL: https://doom404-wallet-signal-bncopbgox-doom-404.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GLITCH_LIQUIDITY_MINT: ${{ inputs.mint }}
          GLITCH_EVIDENCE_OUTPUT: liquidity-evidence.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/liquidity-evidence-worker.mjs
      - name: Retain evidence for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-evidence-${{ github.run_id }}
          path: mvp/wallet-signal/liquidity-evidence.json
          if-no-files-found: ignore
          retention-days: 30
