name: GLITCH liquidity historical replay (isolated)
on:
  workflow_dispatch:
    inputs:
      pool:
        description: Pump AMM pool address
        required: true
        type: string
      replay_offset:
        description: Start index within preserved checkpoint signatures
        required: false
        default: '0'
        type: string
      previous_replay_run_id:
        description: Optional previous replay run ID for deduplication
        required: false
        default: ''
        type: string
      source_run_id:
        description: Existing historical investigation run ID containing the preserved checkpoint
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: glitch-liquidity-replay-${{ inputs.pool }}
  cancel-in-progress: false
jobs:
  replay:
    if: github.ref == 'refs/heads/feature/glitch-liquidity-evidence-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: mvp/wallet-signal
      - name: Restore explicit historical checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          case "$SOURCE_RUN_ID" in *[!0-9]*|'') echo "Invalid source run ID"; exit 1;; esac
          mkdir -p previous-history
          gh run download "$SOURCE_RUN_ID" --name "liquidity-history-$SOURCE_RUN_ID" --dir previous-history
          test -s previous-history/liquidity-history-evidence.json
      - name: Restore optional previous replay evidence
        if: inputs.previous_replay_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_replay_run_id }}
        run: |
          case "$PREVIOUS_RUN_ID" in *[!0-9]*|'') echo "Invalid previous replay run ID"; exit 1;; esac
          mkdir -p previous-replay
          gh run download "$PREVIOUS_RUN_ID" --name "liquidity-replay-$PREVIOUS_RUN_ID" --dir previous-replay
          test -s previous-replay/liquidity-history-replay-evidence.json
      - name: Generate bounded replay plan
        working-directory: mvp/wallet-signal
        env:
          GLITCH_LIQUIDITY_POOL: ${{ inputs.pool }}
          GLITCH_HISTORY_CHECKPOINT: ${{ github.workspace }}/previous-history/liquidity-history-evidence.json
          GLITCH_REPLAY_PLAN_LIMIT: '20'
          GLITCH_REPLAY_PLAN_OFFSET: ${{ inputs.replay_offset }}
        run: node scripts/liquidity-historical-replay-plan.mjs
      - name: Execute read-only replay
        working-directory: mvp/wallet-signal
        env:
          GLITCH_LIQUIDITY_POOL: ${{ inputs.pool }}
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          GLITCH_HISTORY_CHECKPOINT: ${{ github.workspace }}/previous-history/liquidity-history-evidence.json
          GLITCH_HISTORY_REPLAY_PLAN: liquidity-history-replay-plan.json
          GLITCH_HISTORY_REPLAY_BUDGET: '20'
          GLITCH_HISTORY_PREVIOUS_REPLAY: ${{ inputs.previous_replay_run_id != '' && format('{0}/previous-replay/liquidity-history-replay-evidence.json', github.workspace) || '' }}
        run: node scripts/liquidity-historical-replay-executor.mjs
      - name: Preserve replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-replay-${{ github.run_id }}
          path: |
            mvp/wallet-signal/liquidity-history-replay-plan.json
            mvp/wallet-signal/liquidity-history-replay-evidence.json
          retention-days: 30
          if-no-files-found: ignore
