name: GLITCH Scanner checks
on:
  push:
    branches:
      - feature/creator-origin-cb02e
    paths:
      - 'mvp/wallet-signal/**'
      - '.github/workflows/glitch-scanner-checks.yml'
  pull_request:
    paths:
      - 'mvp/wallet-signal/**'
      - '.github/workflows/glitch-scanner-checks.yml'
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mvp/wallet-signal/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run evidence regression tests
        run: npm run test:smoke
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
