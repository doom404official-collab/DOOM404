name: Top20 Snapshot Write Read
on:
  workflow_dispatch:
    inputs:
      mint:
        description: 'Solana token mint'
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Save and verify frozen snapshot
        env:
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          TEST_TOKEN_MINT: ${{ inputs.mint }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/write-top20-snapshot.mjs
