name: GLITCH holder history checkpoint
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    if: github.ref == 'refs/heads/feature/glitch-assessment-sprint1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run checkpoint scanner (read-only)
        env:
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
        run: node scripts/scan-holder-history-resumable.mjs
      - name: Upload diagnostic checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holder-history-checkpoint
          path: mvp/wallet-signal/artifacts/holder-history-checkpoint.json
          if-no-files-found: warn
          retention-days: 7
