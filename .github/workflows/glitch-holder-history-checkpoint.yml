name: GLITCH holder history checkpoint
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  scan:
    if: github.ref == 'refs/heads/feature/glitch-assessment-sprint1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore previous holder checkpoint
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import json,os,urllib.request,zipfile,io
          repo=os.environ["GH_REPO"]
          token=os.environ["GH_TOKEN"]
          current=int(os.environ["GH_RUN_ID"])
          base=f"https://api.github.com/repos/{repo}"
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","User-Agent":"glitch-readonly-resume"}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as response:return response.read()
          runs=json.loads(get(base+"/actions/workflows/glitch-holder-history-checkpoint.yml/runs?branch=feature%2Fglitch-assessment-sprint1&per_page=30"))["workflow_runs"]
          for run in runs:
              if run["id"]>=current or run.get("status")!="completed":continue
              artifacts=json.loads(get(base+f"/actions/runs/{run['id']}/artifacts?per_page=100"))["artifacts"]
              match=next((a for a in artifacts if a["name"]=="holder-history-checkpoint" and not a["expired"]),None)
              if not match:continue
              blob=get(base+f"/actions/artifacts/{match['id']}/zip")
              with zipfile.ZipFile(io.BytesIO(blob)) as archive:
                  names=[n for n in archive.namelist() if n.endswith("holder-history-checkpoint.json")]
                  if not names:continue
                  payload=json.loads(archive.read(names[0]))
              if payload.get("version")!=1 or payload.get("mint")!="98kfF7rmsg1QDUEoCqNE7g7M1FdrTt92TEp2CLzypump":continue
              with open("artifacts/resume.json","w") as output:json.dump(payload,output)
              print("Previous checkpoint restored from run",run["id"])
              break
          else:print("No compatible previous checkpoint; starting fresh")
          PY
      - name: Run checkpoint scanner (read-only)
        env:
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
        run: |
          if [ -f artifacts/resume.json ]; then
            HOLDER_CHECKPOINT_PATH=artifacts/resume.json node scripts/scan-holder-history-resumable.mjs
          else
            node scripts/scan-holder-history-resumable.mjs
          fi
      - name: Upload diagnostic checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holder-history-checkpoint
          path: mvp/wallet-signal/artifacts/holder-history-checkpoint.json
          if-no-files-found: warn
          retention-days: 7
