name: Holder Concentration Live Assessment
on:
  workflow_dispatch:
    inputs:
      mint:
        description: 'Solana mint address'
        required: true
        type: string
permissions:
  contents: read
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Calculate provisional holder assessment
        env:
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          TEST_TOKEN_MINT: ${{ inputs.mint }}
        run: node scripts/check-holder-assessment.mjs
