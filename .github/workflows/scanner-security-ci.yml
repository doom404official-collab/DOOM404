name: Scanner security and regression
on:
  push:
    branches: [integration/glitch-app-main-20261118, qualification/autonomous-engine-20261128]
    paths: ['mvp/wallet-signal/**', '.github/workflows/scanner-security-ci.yml', '.github/workflows/glitch-evidence-validation-manual.yml']
permissions:
  contents: read
  statuses: write
concurrency:
  group: scanner-security-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    name: scanner-security
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: scanner_security_test
          POSTGRES_USER: scanner_fixture
          POSTGRES_PASSWORD: scanner_fixture_only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U scanner_fixture -d scanner_security_test" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/scanner-security.test.mjs tests/scanner-release-gate.test.mjs
      - name: Test isolated PostgreSQL privileges and cross-instance admission
        env:
          SCANNER_TEST_DATABASE_URL: postgresql://scanner_fixture:scanner_fixture_only@127.0.0.1:5432/scanner_security_test
        run: node tests/security/scanner-postgres-concurrency.mjs
      - name: Publish required Vercel security status
        if: always() && github.ref == 'refs/heads/integration/glitch-app-main-20261118'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCANNER_CHECK_NAME: scanner-security
          SCANNER_CHECK_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: node scripts/security/publish-release-status.mjs
  regression:
    name: scanner-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/scanner-browser" --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/scanner-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Five tabs, eight viewports, progressive states and saved-report replay
        run: |
          export NODE_PATH="$RUNNER_TEMP/scanner-browser/node_modules"
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/scanner-browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3100 > /dev/null; then break; fi
            sleep 1
          done
          node tests/ri62-64-saved-report-browser.mjs
      - name: Publish required Vercel regression status
        if: always() && github.ref == 'refs/heads/integration/glitch-app-main-20261118'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCANNER_CHECK_NAME: scanner-regression
          SCANNER_CHECK_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: node scripts/security/publish-release-status.mjs
