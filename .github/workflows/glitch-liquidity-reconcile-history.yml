name: GLITCH liquidity reconcile historical evidence
on:
  workflow_dispatch:
    inputs:
      pool:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    if: github.ref == 'refs/heads/feature/glitch-liquidity-evidence-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: mvp/wallet-signal
      - name: Restore original historical checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/original
          gh run download 39398375163 --name liquidity-history-39398375163 --dir evidence/original
      - name: Restore four replay artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 39403525758 39407100971 39408184474 39409531385; do
            mkdir -p "evidence/replay-$run"
            gh run download "$run" --name "liquidity-replay-$run" --dir "evidence/replay-$run"
          done
      - name: Restore pending recovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/recovery
          gh run download 39550187754 --name liquidity-pending-39550187754 --dir evidence/recovery
      - name: Reconcile and validate
        working-directory: mvp/wallet-signal
        env:
          GLITCH_LIQUIDITY_POOL: ${{ inputs.pool }}
        run: |
          node scripts/liquidity-reconcile-history.mjs \
            ../../evidence/original/liquidity-history-evidence.json \
            ../../evidence/replay-39403525758/liquidity-history-replay-evidence.json \
            ../../evidence/replay-39407100971/liquidity-history-replay-evidence.json \
            ../../evidence/replay-39408184474/liquidity-history-replay-evidence.json \
            ../../evidence/replay-39409531385/liquidity-history-replay-evidence.json \
            ../../evidence/recovery/liquidity-pending-recovery-evidence.json \
            liquidity-history-evidence.json
          node scripts/liquidity-validate-continuation.mjs liquidity-history-evidence.json
      - name: Preserve reconciled checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-reconciled-${{ github.run_id }}
          path: mvp/wallet-signal/liquidity-history-evidence.json
          retention-days: 30
          if-no-files-found: ignore
