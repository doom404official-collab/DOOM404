name: GLITCH liquidity historical investigation
on:
  workflow_dispatch:
    inputs:
      pool:
        description: Pump AMM pool address
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: glitch-liquidity-history-${{ inputs.pool }}
  cancel-in-progress: false
jobs:
  investigate:
    if: github.ref == 'refs/heads/feature/glitch-liquidity-evidence-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: mvp/wallet-signal
      - name: Restore previous checkpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GLITCH_LIQUIDITY_POOL: ${{ inputs.pool }}
        run: |
          gh run list --workflow glitch-liquidity-history-investigator.yml --branch feature/glitch-liquidity-evidence-worker --limit 30 --json databaseId,event --jq '.[] | select(.event=="workflow_dispatch") | .databaseId' > history-run-ids.txt
          while read -r run; do
            mkdir -p previous-history
            if gh run download "$run" --name "liquidity-history-$run" --dir previous-history 2>/dev/null && test -s previous-history/liquidity-history-evidence.json; then
              if node -e 'const s=require("./previous-history/liquidity-history-evidence.json");if(s.pool!==process.env.GLITCH_LIQUIDITY_POOL||s.schemaVersion!==1||s.classification!=="AMOUNT_RECONCILED_AUTHORIZATION_PENDING")process.exit(1)'; then break; fi
            fi
            rm -f previous-history/liquidity-history-evidence.json
          done < history-run-ids.txt
      - name: Investigate bounded historical signatures
        working-directory: mvp/wallet-signal
        env:
          GLITCH_LIQUIDITY_POOL: ${{ inputs.pool }}
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          ALCHEMY_RPC_URL: ${{ secrets.ALCHEMY_RPC_URL }}
          GLITCH_HISTORY_BUDGET: '60'
          GLITCH_HISTORY_CHECKPOINT: ${{ github.workspace }}/previous-history/liquidity-history-evidence.json
        run: |
          if [ ! -s "$GLITCH_HISTORY_CHECKPOINT" ]; then unset GLITCH_HISTORY_CHECKPOINT; fi
          node scripts/liquidity-historical-investigator.mjs
      - name: Archive checkpoint and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-history-${{ github.run_id }}
          path: mvp/wallet-signal/liquidity-history-evidence.json
          retention-days: 30
          if-no-files-found: ignore
