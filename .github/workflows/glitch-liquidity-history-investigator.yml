name: GLITCH liquidity historical investigation
on:
  workflow_dispatch:
    inputs:
      checkpoint_run_id:
        description: Required run ID containing reconciled 34-signature checkpoint artifact
        required: true
        type: string
      pool:
        description: Pump AMM pool address
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: glitch-liquidity-history-${{ inputs.pool }}
  cancel-in-progress: false
jobs:
  investigate:
    if: github.ref == 'refs/heads/feature/glitch-liquidity-evidence-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: mvp/wallet-signal
      - name: Restore explicit reconciled checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
        run: |
          case "$CHECKPOINT_RUN_ID" in *[!0-9]*|'') echo "Invalid checkpoint run ID"; exit 1;; esac
          mkdir -p previous-history
          gh run download "$CHECKPOINT_RUN_ID" --name "liquidity-reconciled-$CHECKPOINT_RUN_ID" --dir previous-history
          test -s previous-history/liquidity-history-evidence.json
      - name: Validate reconciled checkpoint
        working-directory: mvp/wallet-signal
        env:
          GLITCH_LIQUIDITY_POOL: ${{ inputs.pool }}
        run: node scripts/liquidity-validate-continuation.mjs "${{ github.workspace }}/previous-history/liquidity-history-evidence.json"
      - name: Investigate bounded historical signatures
        working-directory: mvp/wallet-signal
        env:
          GLITCH_LIQUIDITY_POOL: ${{ inputs.pool }}
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          ALCHEMY_RPC_URL: ${{ secrets.ALCHEMY_RPC_URL }}
          GLITCH_HISTORY_BUDGET: '60'
          GLITCH_HISTORY_CHECKPOINT: ${{ github.workspace }}/previous-history/liquidity-history-evidence.json
        run: |
          node scripts/liquidity-historical-investigator.mjs
      - name: Archive checkpoint and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-history-${{ github.run_id }}
          path: mvp/wallet-signal/liquidity-history-evidence.json
          retention-days: 30
          if-no-files-found: ignore
