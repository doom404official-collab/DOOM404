name: GLITCH H06 sensitivity report
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/glitch-assessment-sprint1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report observed exclusion sensitivity
        working-directory: mvp/wallet-signal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/holder-h06-live-sensitivity.mjs
