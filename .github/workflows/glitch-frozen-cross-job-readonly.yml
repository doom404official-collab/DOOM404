name: GLITCH frozen cross-job graph read-only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/glitch-assessment-sprint1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate frozen snapshot against both existing jobs without writes
        working-directory: mvp/wallet-signal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {summarizeFrozenCrossJobNetwork} from './lib/frozenCrossJobNetwork.mjs';
          const base=process.env.SUPABASE_URL?.replace(/\/$/,'');
          const key=process.env.SUPABASE_SERVICE_ROLE_KEY;
          if(!base?.startsWith('https://')||!key)throw Error('SUPABASE_SECRETS_MISSING');
          const headers={apikey:key,Authorization:'Bearer '+key};
          async function read(table,query){
           const response=await fetch(base+'/rest/v1/'+table+'?'+query,{headers,cache:'no-store'});
           if(!response.ok)throw Error('READ_ONLY_QUERY_FAILED_'+response.status);
           return response.json();
          }
          const snapshotId='1379bcb43b07be4b783dd4aa67bcabab50cc363cf36c4ca31c943204ccda0153';
          const mint='98kfF7rmsg1QDUEoCqNE7g7M1FdrTt92TEp2CLzypump';
          const [snapshots,jobs]=await Promise.all([
           read('glitch_top20_snapshots','id=eq.'+snapshotId+'&select=id,mint,status,supply_raw,holder_ranking,excluded_wallets'),
           read('glitch_holder_scan_jobs','mint=eq.'+mint+'&select=id,mint,version,status,updated_at,checkpoint')
          ]);
          if(snapshots.length!==1||jobs.length!==2)throw Error('SNAPSHOT_OR_JOB_SET_CHANGED');
          const snapshot=snapshots[0];
          if(snapshot.mint!==mint)throw Error('SNAPSHOT_MINT_MISMATCH');
          const result=summarizeFrozenCrossJobNetwork({snapshot,jobs});
          if(result.sourceJobCount!==2||result.historyComplete!==false||result.finalScore!==null||
             result.checkpointModified!==false||result.scorePromoted!==false||
             result.observed.historyComplete!==false||result.observed.calibrated!==false)
             throw Error('OBSERVED_ONLY_SAFETY_CONTRACT_FAILED');
          console.log(JSON.stringify({status:'OBSERVED_ONLY_VALIDATED',snapshotId,
           jobs:jobs.map(j=>({id:j.id,version:j.version,status:j.status,updatedAt:j.updated_at})),
           uniqueTransferRecords:result.uniqueTransferRecords,observedNetworkScore:result.observed.score,
           evidence:result.observed.evidence,historyComplete:false,finalScore:null,
           checkpointModified:false,scorePromoted:false}));
          JS
