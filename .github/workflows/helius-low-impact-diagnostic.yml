name: Helius Low Impact Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: helius-low-impact-diagnostic
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: mvp/wallet-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure bounded Helius requests
        run: node scripts/check-helius-low-impact.mjs
        env:
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
