function missionProgress(key,value){if(daily.date!==missionDate())daily=readMissions();const m=missionDefs.find(x=>x.key===key);if(!m)return;const old=daily.progress[key]||0;daily.progress[key]=Math.min(m.goal,Math.max(old,value));if(daily.progress[key]>=m.goal&&!daily.claimed[key]){daily.claimed[key]=true;daily.earned+=m.reward;bonus+=m.reward;missionToast='MISSION COMPLETE +'+m.reward;missionToastTime=2.4;}saveMissions();refreshMissions()}
let missionPaused=false,resumeCountdown=0,manualPaused=false,autoPaused=false;function syncPauseUI(){const running=state==='play';const missionsOpen=document.getElementById('missions').style.display==='block';document.getElementById('pauseToggle').style.display=running&&!missionsOpen&&!manualPaused?'block':'none';document.getElementById('pausePanel').style.display=running&&manualPaused&&!missionsOpen?'block':'none';}
function setMissionOpen(open){if(open&&state==='play'){missionPaused=true;resumeCountdown=0;}else if(!open&&missionPaused&&state==='play'){missionPaused=false;if(!manualPaused&&!autoPaused)resumeCountdown=3;}else if(!open){missionPaused=false;resumeCountdown=0;}document.getElementById('missions').style.display=open?'block':'none';document.getElementById('lessonPanel').style.display=open?'none':(state==='dead'&&dead?'block':'none');document.getElementById('missionToggle').style.display=open?'none':'block';if(open)refreshMissions();syncPauseUI()};document.getElementById('missionToggle').onclick=()=>setMissionOpen(true);

function pauseGame(auto=false){if(state!=='play')return;resumeCountdown=0;if(auto)autoPaused=true;else manualPaused=true;syncPauseUI();}

window.addEventListener('blur',()=>{if(state==='play'&&!missionPaused)pauseGame(true)});

 const w=surface.clientWidth,h=surface.clientHeight;if(surface.width!==Math.round(w*renderer.getPixelRatio())||surface.height!==Math.round(h*renderer.getPixelRatio()))renderer.setSize(w,h,false);
 const aspect=w/Math.max(1,h);camera.left=-400*aspect;camera.right=400*aspect;camera.top=400;camera.bottom=-400;camera.updateProjectionMatrix();
 if(mascot&&window.DOOM_RUNNER_BRIDGE){const s=window.DOOM_RUNNER_BRIDGE();

 const sx=400*aspect/240,sy=1;

 mascot.position.set(cx,cy,0);
 mascot.position.x-=mascot.userData.center.x*mascot.userData.scale;
 mascot.position.y-=mascot.userData.center.y*mascot.userData.scale;
 mascot.position.z-=mascot.userData.center.z*mascot.userData.scale;
 const airborne=s.state==='play'&&s.jumps>0;
 if(clips.running){clips.running.paused=airborne||s.state==='dead';clips.running.timeScale=Math.max(.85,Math.min(2.1,s.speed/305));}
 if(mixer)mixer.update(s.paused?0:dt);
 // Procedural poses driven by existing humanoid rig; no extra purchased animations.
 // Reset all affected rotations every frame to prevent accumulated deformation.
 if(airborne){
 for(const [name,b] of Object.entries(bones)){if(baseRot[name])b.rotation.copy(baseRot[name]);}
 const takeoff=s.vy<0;const double=s.jumps===2;
 for(const [name,b] of Object.entries(bones)){
 if(/LeftUpLeg/.test(name))b.rotation.x+=takeoff?-.55:-.25;
 if(/RightUpLeg/.test(name))b.rotation.x+=takeoff?.4:.55;
 if(/LeftLeg|RightLeg/.test(name))b.rotation.x+=.6;

 if(/RightArm/.test(name))b.rotation.x+=double?-.95:-.5;
 }
 mascot.rotation.z=double?-.13:-.06;
 }else{mascot.rotation.z=0;}
 // Smooth landing squash without changing collision logic.
 if(s.state==='play'&&!airborne&&s.runTime>0){const q=Math.max(0,1-Math.abs(s.vy)/80);mascot.scale.setScalar(mascot.userData.scale*(1-.015*q));}
 else mascot.scale.setScalar(mascot.userData.scale);
 mascot.visible=true;
 }
 renderer.render(scene,camera);
}requestAnimationFrame(render);
