<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOOM404 Editorial Test</title><style>body{background:#111;color:#eee;font:18px system-ui;padding:24px}button{background:#b91c1c;color:white;padding:14px;border:0;border-radius:8px}pre{white-space:pre-wrap}</style><h1>V16 Editorial Connectivity</h1><p>Preview diagnostic. One bounded API request per click.</p><button id="test">Test Editorial API</button><pre id="result" aria-live="polite"></pre><script>const b=document.getElementById('test'),o=document.getElementById('result');b.onclick=async()=>{b.disabled=true;const start=performance.now();o.textContent='Testing…';try{const r=await fetch('/api/editorial-health',{method:'POST'});const d=await r.json();o.textContent=JSON.stringify({http:r.status,elapsedMs:Math.round(performance.now()-start),...d},null,2)}catch{o.textContent='Request failed'}finally{b.disabled=false}};</script></html>
